[project]
name = "brain-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0", "brain-cli"]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[tool.uv.sources]
brain-cli = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_mcp"]
